[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-hardening-kit"
version = "0.2.0"
description = "A local LangGraph hardening lab with tenant admission controls and evaluation."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
authors = [{ name = "Muhammad Haseeb" }]
dependencies = [
  "langgraph==1.2.16",
  "pydantic==2.14.1",
  "temporalio==1.35.0",
  "opentelemetry-sdk==1.45.1",
  "opentelemetry-exporter-otlp-proto-http==1.45.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "setuptools==84.2.1"]

[project.scripts]
ahk = "agent_hardening_kit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_hardening_kit = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
