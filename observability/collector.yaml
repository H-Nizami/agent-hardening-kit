# Local lab: loopback-only OTLP and Prometheus endpoints; never expose publicly.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:4318
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 128
    spike_limit_mib: 32
  transform/allowlist:
    error_mode: propagate
    trace_statements:
      - context: resource
        statements:
          - keep_keys(attributes, ["service.name", "service.version"])
      - context: span
        statements:
          - keep_keys(attributes, ["ahk.stage", "gen_ai.operation.name", "gen_ai.provider.name"])
    metric_statements:
      - context: resource
        statements:
          - keep_keys(attributes, ["service.name", "service.version"])
      - context: datapoint
        statements:
          - keep_keys(attributes, ["status", "stage", "direction", "accounting_unit", "backend"])
exporters:
  file/traces:
    path: ${env:AHK_TRACE_FILE}
    flush_interval: 100ms
  prometheus:
    endpoint: 0.0.0.0:9464
    send_timestamps: false
service:
  telemetry:
    logs:
      level: error
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, transform/allowlist]
      exporters: [file/traces]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, transform/allowlist]
      exporters: [prometheus]
