{{- if .Values.observability.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: {{ .Release.Namespace }}
  name: {{ include "ahk.fullname" . }}-prometheus
  labels:
    {{- include "ahk.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "ahk.selector" . | nindent 6 }}
      app.kubernetes.io/component: prometheus
  template:
    metadata:
      labels:
        {{- include "ahk.selector" . | nindent 8 }}
        app.kubernetes.io/component: prometheus
      annotations:
        checksum/rules: {{ .Files.Get "files/slo-rules.yaml" | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "ahk.podSecurity" . | nindent 8 }}
      containers:
        - name: prometheus
          image: {{ .Values.observability.prometheusImage | quote }}
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=2h
            - --storage.tsdb.retention.size=128MB
            - --web.listen-address=:9090
          securityContext:
            {{- include "ahk.containerSecurity" . | nindent 12 }}
          resources:
            {{- toYaml .Values.observability.prometheusResources | nindent 12 }}
          ports:
            - name: http
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: data
              mountPath: /prometheus
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: {{ include "ahk.fullname" . }}-prometheus
        - name: data
          emptyDir:
            sizeLimit: 256Mi
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  namespace: {{ .Release.Namespace }}
  name: {{ include "ahk.fullname" . }}-prometheus
  labels:
    {{- include "ahk.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "ahk.selector" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: {{ .Release.Namespace }}
  name: {{ include "ahk.fullname" . }}-grafana
  labels:
    {{- include "ahk.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "ahk.selector" . | nindent 6 }}
      app.kubernetes.io/component: grafana
  template:
    metadata:
      labels:
        {{- include "ahk.selector" . | nindent 8 }}
        app.kubernetes.io/component: grafana
      annotations:
        checksum/dashboard: {{ .Files.Get "files/dashboard.json" | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "ahk.podSecurity" . | nindent 8 }}
      containers:
        - name: grafana
          image: {{ .Values.observability.grafanaImage | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Viewer
            - name: GF_AUTH_BASIC_ENABLED
              value: "false"
            - name: GF_AUTH_DISABLE_LOGIN_FORM
              value: "true"
            - name: GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION
              value: "true"
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_UPDATES
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES
              value: "false"
            - name: GF_NEWS_NEWS_FEED_ENABLED
              value: "false"
            - name: GF_PLUGINS_PREINSTALL_DISABLED
              value: "true"
            - name: GF_PLUGINS_PUBLIC_KEY_RETRIEVAL_DISABLED
              value: "true"
            - name: GF_PATHS_LOGS
              value: /tmp/grafana-logs
          securityContext:
            {{- include "ahk.containerSecurity" . | nindent 12 }}
          resources:
            {{- toYaml .Values.observability.grafanaResources | nindent 12 }}
          ports:
            - name: http
              containerPort: 3000
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 15
          volumeMounts:
            - name: provisioning
              mountPath: /etc/grafana/provisioning/datasources/ahk.yaml
              subPath: datasource.yaml
              readOnly: true
            - name: provisioning
              mountPath: /etc/grafana/provisioning/dashboards/ahk.yaml
              subPath: provider.yaml
              readOnly: true
            - name: provisioning
              mountPath: /var/lib/grafana/dashboards/ahk.json
              subPath: dashboard.json
              readOnly: true
            - name: data
              mountPath: /var/lib/grafana
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: provisioning
          configMap:
            name: {{ include "ahk.fullname" . }}-grafana
        - name: data
          emptyDir:
            sizeLimit: 128Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  namespace: {{ .Release.Namespace }}
  name: {{ include "ahk.fullname" . }}-grafana
  labels:
    {{- include "ahk.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "ahk.selector" . | nindent 4 }}
    app.kubernetes.io/component: grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
{{- end }}
